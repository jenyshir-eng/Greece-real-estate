name: Athens update
# Daily collection for athens.jenyshir.com. Shares the two secrets with the Thessaloniki
# workflow (TELEGRAM_BOT_TOKEN, PORTAL_ALERTS_CSV_URL).

on:
  schedule:
    # Half an hour after the Thessaloniki run, so the two don't race on git push.
    - cron: '45 7 * * *'
    - cron: '15 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-branch-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run the daily update
        working-directory: cities/athens
        env:
          PORTAL_ALERTS_CSV_URL: ${{ secrets.PORTAL_ALERTS_CSV_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: ./scripts/daily_update.sh

      - name: Commit and push the data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name  "spiti-radar-bot"
          git config user.email "spiti-radar-bot@users.noreply.github.com"
          git add cities/athens/data
          if git diff --cached --quiet; then
            echo "no data changes"; exit 0
          fi
          git commit -m "Athens daily update $(date -u +%F)

Co-Authored-By: Claude Opus 4.7 <noreply@anthropic.com>
Claude-Session: https://claude.ai/code/session_01JCA74WcNqZzwHCwbYr8Hss"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 2))
          done
          echo "push failed after retries" >&2
          exit 1
