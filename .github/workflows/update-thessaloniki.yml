name: Thessaloniki update
# Daily collection for radar.jenyshir.com (Thessaloniki). Runs on GitHub Actions, free for
# this public repo. Replaces the Claude Code scheduled triggers so it does not use the
# owner's weekly Claude limit. Set the two secrets below in Settings → Secrets → Actions:
#   TELEGRAM_BOT_TOKEN     - the morning Telegram messages
#   PORTAL_ALERTS_CSV_URL  - the published alerts sheet (Spitogatos, XE, ...)

on:
  schedule:
    # UTC. Greece is UTC+3 (EEST) in summer and UTC+2 (EET) in winter, so these fire
    # at 10:15 / 18:45 Athens time in summer, 09:15 / 17:45 in winter.
    - cron: '15 7 * * *'
    - cron: '45 15 * * *'
  workflow_dispatch:  # manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: main-branch-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run the daily update
        env:
          PORTAL_ALERTS_CSV_URL: ${{ secrets.PORTAL_ALERTS_CSV_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: ./scripts/daily_update.sh

      - name: Commit and push the data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name  "spiti-radar-bot"
          git config user.email "spiti-radar-bot@users.noreply.github.com"
          git add data/listings
          if git diff --cached --quiet; then
            echo "no data changes"; exit 0
          fi
          new=$(grep -oE "today [0-9]+ new" /tmp/spiti_update.log 2>/dev/null | head -1 | awk '{print $2}')
          [ -z "$new" ] && new=$(awk -F'\t' '$1=="normalize2" {print $3}' build/run_steps.tsv 2>/dev/null)
          git commit -m "Thessaloniki daily update $(date -u +%F): ${new:-?} new listings

Co-Authored-By: Claude Opus 4.7 <noreply@anthropic.com>
Claude-Session: https://claude.ai/code/session_01JCA74WcNqZzwHCwbYr8Hss"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 2))
          done
          echo "push failed after retries" >&2
          exit 1
